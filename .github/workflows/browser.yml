name: Browser tests

# Manual for now. These run the pages anybody can open in a real Chromium (load,
# no errors, no sideways scroll, an axe accessibility scan) and need a browser
# install the main CI job does not. A check nobody has watched go green on the
# runner teaches people to ignore checks, so run this from the Actions tab once
# or twice; when it is boring, change `on:` to `pull_request` like ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Public routes in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:browser
        env:
          CI: "true"

      - name: Keep the failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: e2e/.results
          retention-days: 7
