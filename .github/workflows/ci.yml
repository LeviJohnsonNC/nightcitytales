name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so CI fails on a stale bun.lock rather than
      # silently resolving different versions than a developer gets.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Non-blocking: the Autoformat workflow keeps main Prettier-clean, so a
      # formatting-dirty push (e.g. from Lovable) is reported here without
      # failing the build. Real (non-formatting) eslint errors still surface
      # as annotations.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
