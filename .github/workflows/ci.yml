name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so CI fails on a stale bun.lock rather than
      # silently resolving different versions than a developer gets.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  lint:
    name: Lint changed files
    # Scoped to the files a PR touches on purpose. `eslint .` currently
    # reports ~442 pre-existing prettier/prettier errors across the repo, so
    # a full-repo gate would fail every PR for reasons unrelated to it. This
    # keeps new code clean without demanding a repo-wide reformat first.
    # After running `bun run format` in a dedicated commit, this job can be
    # replaced with a plain `bun run lint`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint files changed by this PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # ACMR: skip deleted files, which have nothing left to lint.
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" \
              | grep -E '\.(js|jsx|ts|tsx)$' || true
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JS/TS files changed by this PR."
            exit 0
          fi
          printf 'Linting %d changed file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          bunx eslint "${files[@]}"
