name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so CI fails on a stale bun.lock rather than
      # silently resolving different versions than a developer gets.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # BLOCKING, and prettier/prettier is switched off for it. The two were
      # one step before: eslint-plugin-prettier turns formatting into an eslint
      # error, formatting-dirty pushes arrive from Lovable routinely, so the
      # whole check had to be continue-on-error — and a linter that cannot fail
      # a build is a linter nothing reads. Splitting them means a real error
      # fails CI while formatting stays advisory.
      - name: Lint
        run: bun run lint:code

      # Non-blocking: the Autoformat workflow keeps main Prettier-clean, so a
      # formatting-dirty push is reported here rather than failing the build.
      - name: Formatting
        run: bun run format:check
        continue-on-error: true

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # The database check CI never had. Everything above runs against code; this
  # builds the schema from nothing and applies whatever migrations came after
  # the baseline, which is the only way a SQL string referencing a column that
  # does not exist gets caught — the type checker does not read inside one, and
  # that is precisely how every encounter save failed silently for weeks.
  #
  # See supabase/replay/README.md for why it starts from a baseline rather than
  # from the first migration.
  migrations:
    name: Migration replay
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5

      - name: Replay onto an empty database
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: supabase/replay/replay.sh
